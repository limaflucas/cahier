[[repo]]
name = "cahier"
[repo.config]
server = "vm-docker-bragi"
git_provider = "gitea.homelab"
git_account = "komodo"
repo = "homelab/cahier"
branch = "master"
webhook_enabled = false

[[resource_sync]]
name = "cahier"
[resource_sync.config]
linked_repo = "cahier"
resource_path = ["deploy/komodo"]
webhook_enabled = false

[[build]]
name = "cahier"
[build.config]
builder = "Bragi"
linked_repo = "cahier"
image_registry = [
  { domain = "registry.homelab", account = "registry", organization = "homelab" }
]
webhook_enabled = false

[[stack]]
name = "cahier"
[stack.config]
swarm = "Homelab"
linked_repo = "cahier"
run_directory = "deploy"
file_paths = ["compose.yaml"]
registry_provider = "registry.homelab"
registry_account = "registry"
webhook_enabled = false

[[stack]]
name = "cahier-ci"
[stack.config]
swarm = "Homelab"
linked_repo = "cahier"
run_directory = "deploy"
file_paths = ["ci.compose.yaml"]
webhook_enabled = false

[[procedure]]
name = "cahier-deploy"
description = "Webhook target for pushes to master. Keep it stable: a sync can't update the procedure that is running it, so rollout steps live in cahier-rollout."

[[procedure.config.stage]]
name = "Sync"
executions = [
  { execution.type = "RunSync", execution.params.sync = "cahier" },
]

[[procedure.config.stage]]
name = "Rollout"
executions = [
  { execution.type = "RunProcedure", execution.params.procedure = "cahier-rollout" },
]

[[procedure]]
name = "cahier-rollout"
description = "Builds the image and rolls out what changed."

[[procedure.config.stage]]
name = "Build"
executions = [
  { execution.type = "RunBuild", execution.params.build = "cahier" },
]

[[procedure.config.stage]]
name = "Deploy"
executions = [
  { execution.type = "DeployStack", execution.params.stack = "cahier" },
  { execution.type = "DeployStackIfChanged", execution.params.stack = "cahier-ci" },
]
